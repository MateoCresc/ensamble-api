name: CI

# Verifica en cada PR (y en cada push a main) que los tests pasan y que las specs de OpenSpec son válidas.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  tests:
    name: Tests y specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Tests (Vitest)
        run: npm test

      - name: Validar specs (OpenSpec)
        env:
          OPENSPEC_TELEMETRY: "0"
        run: npx -y @fission-ai/openspec@latest validate --all --strict

  web:
    name: Interfaz web (tests y build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Angular 22 exige Node ^22.22.3 || ^24.15.0; "22" resuelve a la última 22.x.
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Tests (Vitest + jsdom)
        run: npm test

      - name: Build
        run: npm run build
