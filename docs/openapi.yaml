openapi: 3.0.3
info:
  title: Ensamble — Taller a Medida API
  version: 0.4.0
  description: |
    API REST del taller de fabricación a medida (carpintería / herrería).
    Gestiona clientes, materiales y encargos con arquitectura en capas.

    Todas las respuestas de error tienen el formato `{ "error": { "code", "message", "details"? } }`.
servers:
  - url: /
    description: Servidor actual

tags:
  - name: Estado
    description: Salud del servicio
  - name: Clientes
    description: Personas o empresas que encargan trabajos al taller. El email es único.
  - name: Materiales
    description: Insumos del taller con su unidad de medida y stock. El nombre es único.
  - name: Encargos
    description: Trabajos que un cliente le encarga al taller, con sus materiales y su ciclo de estados.

paths:
  /health:
    get:
      tags: [Estado]
      summary: Estado del servicio
      description: Indica que la API está activa y con qué tipo de persistencia fue iniciada.
      operationId: getHealth
      responses:
        "200":
          description: Servicio activo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok
                persistence: memory
        "500":
          description: Error inesperado del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: INTERNAL_ERROR
                  message: Ocurrió un error inesperado en el servidor

  /clientes:
    get:
      tags: [Clientes]
      summary: Listar clientes
      description: |
        Devuelve los clientes como array. Sin parámetros, ordenados por `id` ascendente.
        Los filtros se combinan; la paginación se aplica después de filtrar y ordenar,
        y solo si se envía `page` o `limit`.

        Los parámetros no traen valor precargado a propósito: en *Try it out* solo se envían los que completes.
      operationId: listarClientes
      parameters:
        - name: nombre
          in: query
          description: Coincidencia parcial con el nombre, sin distinguir mayúsculas (p. ej. `ana`).
          schema: { type: string }
        - name: email
          in: query
          description: Coincidencia exacta con el email, sin distinguir mayúsculas (p. ej. `ana@mail.com`).
          schema: { type: string }
        - name: sort
          in: query
          description: Campo de orden. Con prefijo `-` ordena descendente (p. ej. `-nombre`).
          schema:
            type: string
            enum: [id, -id, nombre, -nombre, email, -email]
        - name: page
          in: query
          description: Número de página (por defecto 1 si se envía `limit`).
          schema: { type: integer, minimum: 1 }
        - name: limit
          in: query
          description: Cantidad por página (por defecto 20 si se envía `page`).
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: Listado de clientes (vacío si no hay coincidencias)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Cliente"
              example:
                - id: 1
                  nombre: Ana Pérez
                  email: ana@mail.com
                  telefono: "1155550000"
                - id: 2
                  nombre: Mariana Gómez
                  email: mariana@mail.com
                  telefono: null
        "400":
          description: Parámetros de consulta inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorValidacion"
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Los datos enviados no son válidos
                  details:
                    - field: sort
                      message: "sort debe ser uno de: id, -id, nombre, -nombre, email, -email"
    post:
      tags: [Clientes]
      summary: Crear cliente
      description: Da de alta un cliente. El email se guarda en minúsculas y no puede repetirse. Un `id` enviado se ignora.
      operationId: crearCliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClienteInput"
            example:
              nombre: Ana Pérez
              email: ana@mail.com
              telefono: "1155550000"
      responses:
        "201":
          description: Cliente creado
          headers:
            Location:
              description: URL del cliente creado
              schema: { type: string }
              example: /clientes/1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cliente"
              example:
                id: 1
                nombre: Ana Pérez
                email: ana@mail.com
                telefono: "1155550000"
        "400":
          description: Cuerpo inválido (un detalle por campo)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorValidacion"
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Los datos enviados no son válidos
                  details:
                    - field: nombre
                      message: El nombre es obligatorio y debe ser texto
                    - field: email
                      message: El email no tiene un formato válido
        "409":
          description: Ya existe un cliente con ese email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: EMAIL_DUPLICADO
                  message: Ya existe un cliente con ese email

  /clientes/{id}:
    parameters:
      - $ref: "#/components/parameters/ClienteId"
    get:
      tags: [Clientes]
      summary: Obtener cliente por id
      operationId: obtenerCliente
      responses:
        "200":
          description: Cliente encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cliente"
              example:
                id: 1
                nombre: Ana Pérez
                email: ana@mail.com
                telefono: "1155550000"
        "400":
          description: Id inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorValidacion"
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Los datos enviados no son válidos
                  details:
                    - field: id
                      message: El id debe ser un número
        "404":
          description: No existe un cliente con ese id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: CLIENTE_NO_ENCONTRADO
                  message: No existe un cliente con id 999
    put:
      tags: [Clientes]
      summary: Actualizar cliente (parcial)
      description: Modifica solo los campos enviados. Hay que enviar al menos uno. `telefono` en `null` lo borra.
      operationId: actualizarCliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClienteUpdate"
            example:
              telefono: "1166660000"
      responses:
        "200":
          description: Cliente actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cliente"
              example:
                id: 1
                nombre: Ana Pérez
                email: ana@mail.com
                telefono: "1166660000"
        "400":
          description: Id o cuerpo inválidos (incluye body sin campos)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorValidacion"
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Los datos enviados no son válidos
                  details:
                    - field: body
                      message: "Enviá al menos uno de estos campos: nombre, email o telefono"
        "404":
          description: No existe un cliente con ese id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: CLIENTE_NO_ENCONTRADO
                  message: No existe un cliente con id 999
        "409":
          description: El email pertenece a otro cliente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: EMAIL_DUPLICADO
                  message: Ya existe un cliente con ese email
    delete:
      tags: [Clientes]
      summary: Eliminar cliente
      operationId: eliminarCliente
      responses:
        "204":
          description: Cliente eliminado (sin cuerpo)
        "400":
          description: Id inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorValidacion"
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Los datos enviados no son válidos
                  details:
                    - field: id
                      message: El id debe ser un número
        "404":
          description: No existe un cliente con ese id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: CLIENTE_NO_ENCONTRADO
                  message: No existe un cliente con id 999
        "409":
          description: El cliente tiene encargos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: CLIENTE_CON_ENCARGOS
                  message: "No se puede eliminar un cliente que tiene encargos"

  /materiales:
    get:
      tags: [Materiales]
      summary: Listar materiales
      description: |
        Devuelve los materiales como array, ordenados por `id` sin parámetros. Los filtros se combinan;
        la paginación se aplica después de filtrar y ordenar, y solo si se envía `page` o `limit`.

        Los parámetros no traen valor precargado a propósito: en *Try it out* solo se envían los que completes.
      operationId: listarMateriales
      parameters:
        - name: nombre
          in: query
          description: Coincidencia parcial con el nombre, sin distinguir mayúsculas (p. ej. `pino`).
          schema: { type: string }
        - name: unidad
          in: query
          description: Unidad de medida exacta.
          schema:
            $ref: "#/components/schemas/Unidad"
        - name: bajoStock
          in: query
          description: "`true`: stock menor o igual al stock mínimo. `false`: el resto."
          schema: { type: string, enum: ["true", "false"] }
        - name: sort
          in: query
          description: Campo de orden; con prefijo `-` ordena descendente (p. ej. `-stock`).
          schema:
            type: string
            enum: [id, -id, nombre, -nombre, stock, -stock]
        - name: page
          in: query
          description: Número de página (por defecto 1 si se envía `limit`).
          schema: { type: integer, minimum: 1 }
        - name: limit
          in: query
          description: Cantidad por página (por defecto 20 si se envía `page`).
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: Listado de materiales
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Material"
              example:
                - id: 1
                  nombre: Tablón de pino
                  unidad: m
                  stock: 2
                  stockMinimo: 5
                - id: 2
                  nombre: Caño de hierro
                  unidad: m
                  stock: 10
                  stockMinimo: 2
        "400":
          description: Parámetros de consulta inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorValidacion"
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Los datos enviados no son válidos
                  details:
                    - field: bajoStock
                      message: "bajoStock debe ser 'true' o 'false'"
    post:
      tags: [Materiales]
      summary: Crear material
      description: Da de alta un material. El nombre no puede repetirse (sin distinguir mayúsculas ni espacios en los extremos). `stock` y `stockMinimo` admiten hasta 2 decimales y por defecto son 0.
      operationId: crearMaterial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialInput"
            example:
              nombre: Tablón de pino
              unidad: m
              stock: 12.5
              stockMinimo: 3
      responses:
        "201":
          description: Material creado
          headers:
            Location:
              description: URL del material creado
              schema: { type: string }
              example: /materiales/1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Material"
              example:
                id: 1
                nombre: Tablón de pino
                unidad: m
                stock: 12.5
                stockMinimo: 3
        "400":
          description: Cuerpo inválido (un detalle por campo)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorValidacion"
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Los datos enviados no son válidos
                  details:
                    - field: unidad
                      message: "La unidad debe ser una de: unidad, m, m2, kg, l"
        "409":
          description: Ya existe un material con ese nombre
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: MATERIAL_DUPLICADO
                  message: "Ya existe un material con ese nombre"

  /materiales/{id}:
    parameters:
      - $ref: "#/components/parameters/MaterialId"
    get:
      tags: [Materiales]
      summary: Obtener material por id
      operationId: obtenerMaterial
      responses:
        "200":
          description: Material encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Material"
              example:
                id: 1
                nombre: Tablón de pino
                unidad: m
                stock: 12.5
                stockMinimo: 3
        "400":
          description: Id inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorValidacion"
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Los datos enviados no son válidos
                  details:
                    - field: id
                      message: "El id debe ser mayor a 0"
        "404":
          description: No existe un material con ese id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: MATERIAL_NO_ENCONTRADO
                  message: "No existe un material con id 999"
    put:
      tags: [Materiales]
      summary: Actualizar material (parcial)
      description: Modifica solo los campos enviados (al menos uno). Sirve para reponer stock.
      operationId: actualizarMaterial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialUpdate"
            example:
              stock: 20
      responses:
        "200":
          description: Material actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Material"
              example:
                id: 1
                nombre: Tablón de pino
                unidad: m
                stock: 20
                stockMinimo: 3
        "400":
          description: Id o cuerpo inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorValidacion"
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Los datos enviados no son válidos
                  details:
                    - field: stock
                      message: "El stock no puede ser negativo"
        "404":
          description: No existe un material con ese id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: MATERIAL_NO_ENCONTRADO
                  message: "No existe un material con id 999"
        "409":
          description: Ya existe un material con ese nombre
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: MATERIAL_DUPLICADO
                  message: "Ya existe un material con ese nombre"
    delete:
      tags: [Materiales]
      summary: Eliminar material
      operationId: eliminarMaterial
      responses:
        "204":
          description: Material eliminado (sin cuerpo)
        "400":
          description: Id inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorValidacion"
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Los datos enviados no son válidos
                  details:
                    - field: id
                      message: "El id debe ser mayor a 0"
        "404":
          description: No existe un material con ese id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: MATERIAL_NO_ENCONTRADO
                  message: "No existe un material con id 999"
        "409":
          description: El material figura en encargos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: MATERIAL_EN_USO
                  message: "No se puede eliminar un material que figura en encargos"

  /encargos:
    get:
      tags: [Encargos]
      summary: Listar encargos
      description: |
        Devuelve los encargos (con cliente y materiales) ordenados por `id`. Filtros combinables;
        paginación con `page` / `limit` como en los otros listados.

        Los parámetros no traen valor precargado a propósito: en *Try it out* solo se envían los que completes.
      operationId: listarEncargos
      parameters:
        - name: clienteId
          in: query
          description: Solo los encargos de ese cliente.
          schema: { type: integer, minimum: 1 }
        - name: estado
          in: query
          description: Solo los encargos en ese estado.
          schema:
            $ref: "#/components/schemas/EstadoEncargo"
        - name: sort
          in: query
          description: "`id` (ascendente) o `-id` (descendente)."
          schema: { type: string, enum: [id, -id] }
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: Listado de encargos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Encargo"
        "400":
          description: Parámetros de consulta inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorValidacion"
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Los datos enviados no son válidos
                  details:
                    - field: estado
                      message: "estado debe ser uno de: presupuestado, confirmado, en_produccion, entregado, cancelado"
    post:
      tags: [Encargos]
      summary: Crear encargo
      description: |
        Crea un encargo **presupuestado** para un cliente existente, con su lista de materiales
        (relación N a N con cantidad). No toca stock: el stock se descuenta al confirmar.
      operationId: crearEncargo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EncargoInput"
            example:
              clienteId: 1
              descripcion: Mesa de comedor
              fechaEntregaEstimada: "2026-12-20"
              materiales:
                - materialId: 1
                  cantidad: 4.5
      responses:
        "201":
          description: Encargo creado
          headers:
            Location:
              description: URL del encargo creado
              schema: { type: string }
              example: /encargos/1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Encargo"
        "400":
          description: Cuerpo inválido (materialId repetido, cantidad <= 0 o con más de 2 decimales, fecha mal formada)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorValidacion"
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Los datos enviados no son válidos
                  details:
                    - field: materiales
                      message: "No se puede repetir un materialId en la lista"
        "404":
          description: El cliente o algún material no existen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: MATERIAL_NO_ENCONTRADO
                  message: "No existen los materiales: 9"
                  details:
                    ids: [9]

  /encargos/{id}:
    parameters:
      - $ref: "#/components/parameters/EncargoId"
    get:
      tags: [Encargos]
      summary: Obtener encargo por id
      operationId: obtenerEncargo
      responses:
        "200":
          description: Encargo encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Encargo"
              example:
                id: 1
                clienteId: 1
                cliente: { id: 1, nombre: Ana Pérez }
                descripcion: Mesa de comedor
                estado: presupuestado
                fechaEntregaEstimada: "2026-12-20"
                materiales:
                  - { materialId: 1, nombre: Tablón de pino, unidad: m, cantidad: 4.5 }
        "400":
          description: Id inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorValidacion"
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Los datos enviados no son válidos
                  details:
                    - field: id
                      message: "El id debe ser mayor a 0"
        "404":
          description: No existe un encargo con ese id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: ENCARGO_NO_ENCONTRADO
                  message: "No existe un encargo con id 999"
    put:
      tags: [Encargos]
      summary: Actualizar encargo presupuestado (parcial)
      description: |
        Modifica `descripcion`, `fechaEntregaEstimada` y/o `materiales` (la lista enviada **reemplaza** a la anterior).
        Solo mientras el encargo está presupuestado. El cliente no se puede cambiar.
      operationId: actualizarEncargo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EncargoUpdate"
            example:
              materiales:
                - materialId: 2
                  cantidad: 3
      responses:
        "200":
          description: Encargo actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Encargo"
              example:
                id: 1
                clienteId: 1
                cliente: { id: 1, nombre: Ana Pérez }
                descripcion: Mesa de comedor
                estado: presupuestado
                fechaEntregaEstimada: "2026-12-20"
                materiales:
                  - { materialId: 1, nombre: Tablón de pino, unidad: m, cantidad: 4.5 }
        "400":
          description: Id o cuerpo inválidos (incluye body sin campos editables)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorValidacion"
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Los datos enviados no son válidos
                  details:
                    - field: body
                      message: "Enviá al menos uno de estos campos: descripcion, fechaEntregaEstimada o materiales"
        "404":
          description: El encargo o algún material no existen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: ENCARGO_NO_ENCONTRADO
                  message: "No existe un encargo con id 999"
        "409":
          description: El encargo ya no está presupuestado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: ENCARGO_NO_EDITABLE
                  message: "Un encargo confirmado no se puede modificar"
    delete:
      tags: [Encargos]
      summary: Eliminar encargo
      description: Solo se pueden eliminar encargos presupuestados o cancelados.
      operationId: eliminarEncargo
      responses:
        "204":
          description: Encargo eliminado (sin cuerpo)
        "400":
          description: Id inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorValidacion"
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Los datos enviados no son válidos
                  details:
                    - field: id
                      message: "El id debe ser mayor a 0"
        "404":
          description: No existe un encargo con ese id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: ENCARGO_NO_ENCONTRADO
                  message: "No existe un encargo con id 999"
        "409":
          description: El encargo no está presupuestado ni cancelado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: ENCARGO_NO_ELIMINABLE
                  message: "Un encargo confirmado no se puede eliminar; cancelalo primero"

  /encargos/{id}/confirmar:
    parameters:
      - $ref: "#/components/parameters/EncargoId"
    put:
      tags: [Encargos]
      summary: Confirmar encargo (descuenta stock)
      description: Pasa un encargo presupuestado a **confirmado** y descuenta el stock de todos sus materiales en una sola operación atómica. Si falta stock de alguno no modifica nada (409 `STOCK_INSUFICIENTE`); también responde 409 con `TRANSICION_INVALIDA` o `ENCARGO_SIN_MATERIALES`. Emite `encargo.confirmado` y, por cada material que queda en o bajo su mínimo, `material.stockBajo`.
      operationId: confirmarEncargo
      responses:
        "200":
          description: Encargo actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Encargo"
              example:
                id: 1
                clienteId: 1
                cliente: { id: 1, nombre: Ana Pérez }
                descripcion: Mesa de comedor
                estado: confirmado
                fechaEntregaEstimada: "2026-12-20"
                materiales:
                  - { materialId: 1, nombre: Tablón de pino, unidad: m, cantidad: 4.5 }
        "400":
          description: Id inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorValidacion"
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Los datos enviados no son válidos
                  details:
                    - field: id
                      message: "El id debe ser mayor a 0"
        "404":
          description: No existe un encargo con ese id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: ENCARGO_NO_ENCONTRADO
                  message: "No existe un encargo con id 999"
        "409":
          description: Stock insuficiente, encargo sin materiales o transición inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: STOCK_INSUFICIENTE
                  message: "No hay stock suficiente para confirmar el encargo"
                  details:
                    - materialId: 2
                      nombre: Caño de hierro
                      requerido: 5
                      disponible: 3

  /encargos/{id}/cancelar:
    parameters:
      - $ref: "#/components/parameters/EncargoId"
    put:
      tags: [Encargos]
      summary: Cancelar encargo (repone stock si estaba confirmado)
      description: Pasa a **cancelado** un encargo presupuestado o confirmado. Si estaba confirmado, repone el stock descontado en la misma operación atómica.
      operationId: cancelarEncargo
      responses:
        "200":
          description: Encargo actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Encargo"
              example:
                id: 1
                clienteId: 1
                cliente: { id: 1, nombre: Ana Pérez }
                descripcion: Mesa de comedor
                estado: cancelado
                fechaEntregaEstimada: "2026-12-20"
                materiales:
                  - { materialId: 1, nombre: Tablón de pino, unidad: m, cantidad: 4.5 }
        "400":
          description: Id inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorValidacion"
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Los datos enviados no son válidos
                  details:
                    - field: id
                      message: "El id debe ser mayor a 0"
        "404":
          description: No existe un encargo con ese id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: ENCARGO_NO_ENCONTRADO
                  message: "No existe un encargo con id 999"
        "409":
          description: La acción no corresponde al estado actual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: TRANSICION_INVALIDA
                  message: "No se puede cancelar un encargo en estado entregado"
                  details:
                    estadoActual: entregado
                    accion: cancelar

  /encargos/{id}/iniciar:
    parameters:
      - $ref: "#/components/parameters/EncargoId"
    put:
      tags: [Encargos]
      summary: Iniciar producción
      description: Pasa un encargo confirmado a **en_produccion**.
      operationId: iniciarEncargo
      responses:
        "200":
          description: Encargo actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Encargo"
              example:
                id: 1
                clienteId: 1
                cliente: { id: 1, nombre: Ana Pérez }
                descripcion: Mesa de comedor
                estado: en_produccion
                fechaEntregaEstimada: "2026-12-20"
                materiales:
                  - { materialId: 1, nombre: Tablón de pino, unidad: m, cantidad: 4.5 }
        "400":
          description: Id inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorValidacion"
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Los datos enviados no son válidos
                  details:
                    - field: id
                      message: "El id debe ser mayor a 0"
        "404":
          description: No existe un encargo con ese id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: ENCARGO_NO_ENCONTRADO
                  message: "No existe un encargo con id 999"
        "409":
          description: La acción no corresponde al estado actual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: TRANSICION_INVALIDA
                  message: "No se puede iniciar un encargo en estado presupuestado"
                  details:
                    estadoActual: presupuestado
                    accion: iniciar

  /encargos/{id}/entregar:
    parameters:
      - $ref: "#/components/parameters/EncargoId"
    put:
      tags: [Encargos]
      summary: Entregar encargo
      description: Pasa un encargo en producción a **entregado**.
      operationId: entregarEncargo
      responses:
        "200":
          description: Encargo actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Encargo"
              example:
                id: 1
                clienteId: 1
                cliente: { id: 1, nombre: Ana Pérez }
                descripcion: Mesa de comedor
                estado: entregado
                fechaEntregaEstimada: "2026-12-20"
                materiales:
                  - { materialId: 1, nombre: Tablón de pino, unidad: m, cantidad: 4.5 }
        "400":
          description: Id inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorValidacion"
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Los datos enviados no son válidos
                  details:
                    - field: id
                      message: "El id debe ser mayor a 0"
        "404":
          description: No existe un encargo con ese id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: ENCARGO_NO_ENCONTRADO
                  message: "No existe un encargo con id 999"
        "409":
          description: La acción no corresponde al estado actual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: TRANSICION_INVALIDA
                  message: "No se puede entregar un encargo en estado confirmado"
                  details:
                    estadoActual: confirmado
                    accion: entregar

components:
  parameters:
    ClienteId:
      name: id
      in: path
      required: true
      description: Id entero del cliente
      schema: { type: integer, minimum: 1 }
      example: 1
    MaterialId:
      name: id
      in: path
      required: true
      description: Id entero del material
      schema: { type: integer, minimum: 1 }
      example: 1
    EncargoId:
      name: id
      in: path
      required: true
      description: Id entero del encargo
      schema: { type: integer, minimum: 1 }
      example: 1

  schemas:
    Cliente:
      type: object
      required: [id, nombre, email, telefono]
      properties:
        id:
          type: integer
          example: 1
        nombre:
          type: string
          example: Ana Pérez
        email:
          type: string
          format: email
          description: Único, guardado en minúsculas
          example: ana@mail.com
        telefono:
          type: string
          nullable: true
          example: "1155550000"

    ClienteInput:
      type: object
      required: [nombre, email]
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 100
          example: Ana Pérez
        email:
          type: string
          format: email
          example: ana@mail.com
        telefono:
          type: string
          nullable: true
          pattern: "^[0-9+\\-\\s]{6,20}$"
          description: De 6 a 20 caracteres (dígitos, espacios, + o -). Opcional.
          example: "1155550000"

    ClienteUpdate:
      type: object
      minProperties: 1
      description: Al menos uno de los campos.
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
        telefono:
          type: string
          nullable: true
          pattern: "^[0-9+\\-\\s]{6,20}$"

    Health:
      type: object
      required: [status, persistence]
      properties:
        status:
          type: string
          enum: [ok]
        persistence:
          type: string
          enum: [memory, sequelize]

    Unidad:
      type: string
      enum: [unidad, m, m2, kg, l]
      description: Unidad de medida del material

    Material:
      type: object
      required: [id, nombre, unidad, stock, stockMinimo]
      properties:
        id:
          type: integer
          example: 1
        nombre:
          type: string
          example: Tablón de pino
        unidad:
          $ref: "#/components/schemas/Unidad"
        stock:
          type: number
          minimum: 0
          multipleOf: 0.01
          example: 12.5
        stockMinimo:
          type: number
          minimum: 0
          multipleOf: 0.01
          example: 3

    MaterialInput:
      type: object
      required: [nombre, unidad]
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 100
          description: Único, sin distinguir mayúsculas ni espacios en los extremos
        unidad:
          $ref: "#/components/schemas/Unidad"
        stock:
          type: number
          minimum: 0
          multipleOf: 0.01
          default: 0
        stockMinimo:
          type: number
          minimum: 0
          multipleOf: 0.01
          default: 0

    MaterialUpdate:
      type: object
      minProperties: 1
      description: Al menos uno de los campos.
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 100
        unidad:
          $ref: "#/components/schemas/Unidad"
        stock:
          type: number
          minimum: 0
          multipleOf: 0.01
        stockMinimo:
          type: number
          minimum: 0
          multipleOf: 0.01

    EstadoEncargo:
      type: string
      enum: [presupuestado, confirmado, en_produccion, entregado, cancelado]
      description: "presupuestado → confirmado → en_produccion → entregado; cancelado desde presupuestado o confirmado."

    EncargoMaterial:
      type: object
      required: [materialId, nombre, unidad, cantidad]
      description: Renglón de la relación N a N entre un encargo y un material.
      properties:
        materialId: { type: integer, example: 1 }
        nombre: { type: string, example: Tablón de pino }
        unidad:
          $ref: "#/components/schemas/Unidad"
        cantidad: { type: number, minimum: 0.01, multipleOf: 0.01, example: 4.5 }

    RenglonInput:
      type: object
      required: [materialId, cantidad]
      properties:
        materialId: { type: integer, minimum: 1, example: 1 }
        cantidad: { type: number, minimum: 0.01, multipleOf: 0.01, example: 4.5 }

    Encargo:
      type: object
      required: [id, clienteId, cliente, descripcion, estado, fechaEntregaEstimada, materiales]
      properties:
        id: { type: integer, example: 1 }
        clienteId: { type: integer, example: 1 }
        cliente:
          type: object
          required: [id, nombre]
          properties:
            id: { type: integer, example: 1 }
            nombre: { type: string, example: Ana Pérez }
        descripcion: { type: string, example: Mesa de comedor }
        estado:
          $ref: "#/components/schemas/EstadoEncargo"
        fechaEntregaEstimada: { type: string, format: date, nullable: true, example: "2026-12-20" }
        materiales:
          type: array
          items:
            $ref: "#/components/schemas/EncargoMaterial"

    EncargoInput:
      type: object
      required: [clienteId, descripcion]
      properties:
        clienteId: { type: integer, minimum: 1 }
        descripcion: { type: string, minLength: 3, maxLength: 500 }
        fechaEntregaEstimada: { type: string, format: date, nullable: true }
        materiales:
          type: array
          description: Sin materialId repetidos.
          items:
            $ref: "#/components/schemas/RenglonInput"

    EncargoUpdate:
      type: object
      minProperties: 1
      description: Al menos uno de los campos. `materiales` reemplaza la lista completa.
      properties:
        descripcion: { type: string, minLength: 3, maxLength: 500 }
        fechaEntregaEstimada: { type: string, format: date, nullable: true }
        materiales:
          type: array
          items:
            $ref: "#/components/schemas/RenglonInput"

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Identificador en MAYÚSCULAS_CON_GUIONES
              example: NOT_FOUND
            message:
              type: string
              description: Texto legible del error
              example: "Ruta no encontrada: GET /no-existe"
            details:
              description: Información adicional; solo aparece cuando corresponde
              oneOf:
                - type: array
                  items: {}
                - type: object

    ErrorValidacion:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              type: string
              enum: [VALIDATION_ERROR]
            message:
              type: string
              example: Los datos enviados no son válidos
            details:
              type: array
              items:
                type: object
                required: [field, message]
                properties:
                  field:
                    type: string
                    example: nombre
                  message:
                    type: string
                    example: "Too small: expected string to have >=1 characters"
